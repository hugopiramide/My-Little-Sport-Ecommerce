services:
  mysql:
    image: mysql:8.4
    container_name: mls-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234.Abcd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eShop}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mls-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-1234.Abcd}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mls-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-eShop}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234.Abcd}

      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-create-drop}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"

      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-uFFFnrCKVU43mk8etbq5XrDipahwTtF2AX4ZYX5cmLS}

      APP_STRIPE_APIKEY: ${STRIPE_SECRET_KEY:-}

      APP_PAYPAL_CLIENTID: ${PAYPAL_CLIENT_ID:-}
      APP_PAYPAL_CLIENTSECRET: ${PAYPAL_CLIENT_SECRET:-}
      APP_PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}

      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      APP_MAIL_FROM: ${MAIL_FROM:-}

      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - mls-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mls-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - mls-network
volumes:
  mysql_data:
    driver: local

networks:
  mls-network:
    driver: bridge
